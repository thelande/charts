apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nextcloud.fullname" . }}
  labels:
    {{- include "nextcloud.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "nextcloud.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "nextcloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "nextcloud.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nextcloud.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}-apache"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: {{ include "nextcloud.fullname" . }}-data
              mountPath: /var/www/html
            - name: database-config
              mountPath: /config/database
              readOnly: true
            - name: {{ include "nextcloud.fullname" . }}-auth
              mountPath: /config/auth
              readOnly: true
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
          {{- include "nextcloud.env" . | nindent 12 }}
          {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: cron
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}-apache"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/cron.sh"]
          resources:
            {{- toYaml .Values.cron.resources | nindent 12 }}
          volumeMounts:
            - name: {{ include "nextcloud.fullname" . }}-data
              mountPath: /var/www/html
          {{- with .Values.cron.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: NEXTCLOUD_DATA_DIR
              value: {{ .Values.nextcloud.dataDir | quote }}
          {{- if .Values.nextcloud.php.memoryLimit }}
            - name: PHP_MEMORY_LIMIT
              value: {{ .Values.nextcloud.php.memoryLimit | quote }}
          {{- end }}
          {{- if .Values.nextcloud.php.uploadLimit }}
            - name: PHP_UPLOAD_LIMIT
              value: {{ .Values.nextcloud.php.uploadLimit | quote }}
          {{- end }}
          {{- with .Values.cron.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: database-config
          secret:
            secretName: {{ .Values.nextcloud.database.existingSecret }}
        - name: {{ include "nextcloud.fullname" . }}-auth
          secret:
            secretName: {{ include "nextcloud.auth.secretName" . }}
      {{- if not .Values.persistence.enabled }}
        - name: {{ include "nextcloud.fullname" . }}-data
          emptyDir: {}
      {{- end }}
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: {{ include "nextcloud.fullname" . }}-data
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          {{- toYaml .Values.persistence.resources | nindent 10 }}
  {{- end }}
