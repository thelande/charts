{{- if not .Values.nextcloud.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nextcloud.auth.secretName" . }}
type: Opaque
data:
  username: {{ .Values.nextcloud.auth.username | b64enc | quote }}
  password: {{ .Values.nextcloud.auth.password | b64enc | quote }}
{{- end }}
