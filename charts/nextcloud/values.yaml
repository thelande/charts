# Default values for nextcloud.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: nextcloud
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

#This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # nginx.ingress.kubernetes.io/proxy-body-size: 512m
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /status.php
    port: http
  periodSeconds: 60
  timeoutSeconds: 10
readinessProbe:
  httpGet:
    path: /status.php
    port: http
  periodSeconds: 60
  timeoutSeconds: 10

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

env: {}

persistence:
  enabled: false
  accessModes: ["ReadWriteOnce"]
  storageClassName: ""
  resources:
    requests:
      storage: 5Gi

cron:
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  volumeMounts: []

  env: {}

nextcloud:
  # -- Optional list of trusted domains.
  trustedDomains: []

  # -- Configures the data directory where nextcloud stores all files from the users.
  dataDir: /var/www/html/data

  php:
    # -- This sets the maximum amount of memory in bytes that a script is allowed to
    # allocate. This is meant to help prevent poorly written scripts from eating
    # up all available memory but it can prevent normal operation if set too tight.
    memoryLimit: ""

    # -- This sets the upload limit (post_max_size and upload_max_filesize) for big
    # files. Note that you may have to change other limits depending on your client,
    # webserver or operating system. Check the Nextcloud documentation⁠ for more
    # information. The ingress proxy limit must also be increased when using an
    # ingress to access nextcloud (e.g., nginx.ingress.kubernetes.io/proxy-body-size).
    uploadLimit: ""

  database:
    # -- The type of database to use. Either postgres or mysql. The database must
    # created manually and is not handled by this chart.
    type: postgres

    # -- The existing secret containing the database connection details.
    # Must have the following keys: host, username, password, and dbname.
    existingSecret: ""

  redis:
    # -- Should redis caching be used.
    enabled: false

    # -- Hostname of the redis service to use.
    host: redis

    # -- Optional port for Redis, only use for external Redis servers that run on non-standard ports.
    port: 6379

    # -- Redis password. Ignored if existingSecret is set.
    password: ""

    # -- The existing secret containing the redis password.
    existingSecret: ""

  smtp:
    # -- Enable external SMTP access.
    enabled: false

    # -- The hostname of the SMTP server.
    host: ""

    # -- Set to ssl to use SSL, or tls to use STARTTLS.
    secure: ""

    # -- Port for the SMTP connection. Use 465 for SSL or 587 for STARTTLS.
    port: 25

    # --
    authType: "LOGIN"

    # -- The username for the authentication. Ignored if existingSecret is set.
    username: ""

    # -- The password for the authentication. Ignored if existingSecret is set.
    password: ""

    # -- Existing secret containing the SMTP server username and password.
    # Must have the following keys: username and password.
    existingSecret: ""

    # -- Set the local-part for the 'from' field in the emails sent by Nextcloud.
    fromAddress: ""

    # -- Set a different domain for the emails than the domain where Nextcloud is installed.
    domain: ""

  auth:
    # -- Name of the Nextcloud admin user. Ignored if existingSecret is set.
    username: admin

    # -- Password for the Nextcloud admin user. Ignored if existingSecret is set.
    password: nextcl0ud123

    # -- Secret containing the admin username and password.
    existingSecret: ""
