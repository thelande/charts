  nodeAffinityPreset:
    # -- Node affinity preset type. Ignored if `meili.affinity` is set. Allowed values: `soft` or `hard`
    type: ""
    # -- Node label key to match. Ignored if `meili.affinity` is set
    key: ""
    # -- Node label values to match. Ignored if `meili.affinity` is set
    values: []
