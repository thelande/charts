  # -- Custom readinessProbe that overrides the default one
  customReadinessProbe: {}
  # -- Custom startupProbe that overrides the default one
  customStartupProbe: {}
  ## saltRim resource requests and limits
  ## ref: http://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
  # -- Set saltRim container resources according to one common preset (allowed values: none, nano, small, medium, large, xlarge, 2xlarge). This is ignored if saltRim.resources is set (saltRim.resources is recommended for production).
  # More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  resourcesPreset: "nano"
  # -- Set saltRim container requests and limits for different resources like CPU or memory (essential for production workloads)
  resources: {}
  ## e.g:
  ## resources:
  ##   requests:
  ##     cpu: 2
  ##     memory: 512Mi
  ##   limits:
  ##     cpu: 3
  ##     memory: 1024Mi
  ##

  ## Configure Pods Security Context
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  podSecurityContext:
    # -- Enable saltRim pods' Security Context
    enabled: true
    # -- Set filesystem group change policy for saltRim pods
    fsGroupChangePolicy: Always
    # -- settings using the sysctl interface for saltRim pods
    sysctls: []
    # -- Set filesystem extra groups for saltRim pods
    supplementalGroups: []
    # -- Set fsGroup in saltRim pods' Security Context
    fsGroup: 1001
  ## Configure Container Security Context
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
  containerSecurityContext:
    # -- Enabled saltRim container' Security Context
    enabled: true
    # -- Set SELinux options in saltRim container
    seLinuxOptions: {}
    # -- Set runAsUser in saltRim container' Security Context
    runAsUser: 1001
    runAsGroup: 1001
    # -- Set runAsNonRoot in saltRim container' Security Context
    runAsNonRoot: true
    # -- Set readOnlyRootFilesystem in saltRim container' Security Context
    readOnlyRootFilesystem: true
    # -- Set privileged in saltRim container' Security Context
    privileged: false
    # -- Set allowPrivilegeEscalation in saltRim container' Security Context
    allowPrivilegeEscalation: false
    # -- List of capabilities to be dropped in saltRim container
    capabilities:
      drop: ["ALL"]
    # -- Set seccomp profile in saltRim container
    seccompProfile:
      type: "RuntimeDefault"
    
  # -- Override default saltRim container command (useful when using custom images)
  command: []
  # -- Override default saltRim container args (useful when using custom images)
  args: []
  # -- Mount Service Account token in saltRim pods
  automountServiceAccountToken: false
  # -- Annotations for saltRim
  # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  annotations: {}
  # -- saltRim pods host aliases
  # ref: https://kubernetes.io/docs/concepts/services-networking/add-entries-to-pod-etc-hosts-with-host-aliases/
  hostAliases: []

  # -- Extra labels for saltRim pods
  # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}
  # -- Annotations for saltRim pods
  # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # -- Pod affinity preset. Ignored if `saltRim.affinity` is set. Allowed values: `soft` or `hard`
  # ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
  podAffinityPreset: ""
  # -- Pod anti-affinity preset. Ignored if `saltRim.affinity` is set. Allowed values: `soft` or `hard`
  # ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
  podAntiAffinityPreset: soft
  ## Node saltRim.affinity preset
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
  nodeAffinityPreset:
    # -- Node affinity preset type. Ignored if `saltRim.affinity` is set. Allowed values: `soft` or `hard`
    type: ""
    # -- Node label key to match. Ignored if `saltRim.affinity` is set
    key: ""
    # -- Node label values to match. Ignored if `saltRim.affinity` is set
    values: []
    ## E.g.
    ## values:
    ##   - e2e-az1
    ##   - e2e-az2
    ##
  # -- Affinity for saltRim pods assignment
  # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  # NOTE: `saltRim.podAffinityPreset`, `saltRim.podAntiAffinityPreset`, and `saltRim.nodeAffinityPreset` will be ignored when it's set
  affinity: {}
  # -- Node labels for saltRim pods assignment
  # ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
  nodeSelector: {}
  # --Tolerations for saltRim pods assignment
  # ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  tolerations: []
  # -- Deployment strategy type
  # ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  updateStrategy:
    ## ONLY FOR DEPLOYMENTS:
    ## Can be set to RollingUpdate or Recreate
    ## ONLY FOR STATEFULSETS:
    ## Can be set to RollingUpdate or OnDelete
    ##
    type: RollingUpdate
  # -- Seconds saltRim pods need to terminate gracefully
  # ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
  terminationGracePeriodSeconds: ""
  # -- Array with extra environment variables to add to saltRim containers
  extraEnvVars: []
  ## e.g:
  ## extraEnvVars:
  ##   - name: FOO
  ##     value: "bar"
  ##

  # -- Name of existing ConfigMap containing extra env vars for saltRim containers
  extraEnvVarsCM: ""
  # -- Name of existing Secret containing extra env vars for saltRim containers
  extraEnvVarsSecret: ""
  # -- Optionally specify extra list of additional volumes for the saltRim pods
  extraVolumes: []
  # -- Optionally specify extra list of additional volumeMounts for the saltRim containers
  extraVolumeMounts: []
  # -- Add additional sidecar containers to the saltRim pods
  sidecars: []
  ## e.g:
  ## sidecars:
  ##   - name: your-image-name
  ##     image: your-image
  ##     imagePullPolicy: Always
  ##     ports:
  ##       - name: portname
  ##         containerPort: 1234
  ##

  # -- Add additional init containers to the saltRim pods
  # ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  initContainers: []
  ## e.g:
  ## initContainers:
  ##  - name: your-image-name
  ##    image: your-image
  ##    imagePullPolicy: Always
  ##    command: ['sh', '-c', 'echo "hello world"']
  ##

