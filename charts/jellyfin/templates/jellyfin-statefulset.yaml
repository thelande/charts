apiVersion: {{ include "common.capabilities.statefulset.apiVersion" . }}
kind: StatefulSet
metadata:
  name: {{ template "jellyfin.jellyfin.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: jellyfin
  {{- if or .Values.jellyfin.statefulsetAnnotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" (dict "values" (list .Values.jellyfin.statefulsetAnnotations .Values.commonAnnotations) "context" .) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.jellyfin.replicaCount }}
  podManagementPolicy: {{ .Values.podManagementPolicy | quote }}
  {{- $podLabels := include "common.tplvalues.merge" (dict "values" (list .Values.jellyfin.podLabels .Values.commonLabels) "context" .) }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
      app.kubernetes.io/component: jellyfin
  serviceName: {{ template "common.names.fullname" . }}
  {{- if .Values.jellyfin.updateStrategy }}
  updateStrategy: {{- toYaml .Values.jellyfin.updateStrategy | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- if .Values.jellyfin.podAnnotations }}
      annotations: {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.podAnnotations "context" $) | nindent 8 }}
      {{- end }}
      labels: {{- include "common.labels.standard" ( dict "customLabels" $podLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: jellyfin
    spec:
      {{- include "jellyfin.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ template "jellyfin.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.jellyfin.automountServiceAccountToken }}
      {{- if .Values.jellyfin.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.jellyfin.affinity }}
      affinity: {{- include "common.tplvalues.render" ( dict "value" .Values.jellyfin.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.jellyfin.podAffinityPreset "component" "jellyfin" "customLabels" $podLabels "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.jellyfin.podAntiAffinityPreset "component" "jellyfin" "customLabels" $podLabels "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.jellyfin.nodeAffinityPreset.type "key" .Values.jellyfin.nodeAffinityPreset.key "values" .Values.jellyfin.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- if .Values.jellyfin.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" ( dict "value" .Values.jellyfin.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.jellyfin.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.tolerations "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.jellyfin.priorityClassName }}
      priorityClassName: {{ .Values.jellyfin.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.jellyfin.schedulerName }}
      schedulerName: {{ .Values.jellyfin.schedulerName | quote }}
      {{- end }}
      {{- if .Values.jellyfin.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.topologySpreadConstraints "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.jellyfin.podSecurityContext.enabled }}
      securityContext: {{- omit .Values.jellyfin.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.jellyfin.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.jellyfin.terminationGracePeriodSeconds }}
      {{- end }}
      {{- with .Values.jellyfin.initContainers }}
      initContainers:
        {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      containers:
        - name: jellyfin
          image: {{ template "jellyfin.jellyfin.image" . }}
          imagePullPolicy: {{ .Values.jellyfin.image.pullPolicy }}
          {{- if .Values.jellyfin.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.jellyfin.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          {{- else if .Values.jellyfin.command }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.command "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- else if .Values.jellyfin.args }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.args "context" $) | nindent 12 }}
          {{- end }}
          env:
            - name: TZ
              value: "America/Los_Angeles"
            {{- if .Values.jellyfin.extraEnvVars }}
            {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.extraEnvVars "context" $) | nindent 12 }}
            {{- end }}
          envFrom:
            {{- if .Values.jellyfin.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.jellyfin.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.jellyfin.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.jellyfin.extraEnvVarsSecret "context" $) }}
            {{- end }}
          {{- if .Values.jellyfin.resources }}
          resources: {{- toYaml .Values.jellyfin.resources | nindent 12 }}
          {{- else if ne .Values.jellyfin.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.jellyfin.resourcesPreset) | nindent 12 }}
          {{- end }}
          {{- with .Values.jellyfin.extraContainerPorts }}
          ports:
            {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 12 }}
          {{- end }}
          {{- if not .Values.diagnosticMode.enabled }}
          {{- if .Values.jellyfin.customLivenessProbe }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.customLivenessProbe "context" $) | nindent 12 }}
          {{- else if .Values.jellyfin.livenessProbe.enabled }}
          livenessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.jellyfin.livenessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.jellyfin.customReadinessProbe }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.customReadinessProbe "context" $) | nindent 12 }}
          {{- else if .Values.jellyfin.readinessProbe.enabled }}
          readinessProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.jellyfin.readinessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.jellyfin.customStartupProbe }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.customStartupProbe "context" $) | nindent 12 }}
          {{- else if .Values.jellyfin.startupProbe.enabled }}
          startupProbe: {{- include "common.tplvalues.render" (dict "value" (omit .Values.jellyfin.startupProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- if .Values.jellyfin.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-cache
              mountPath: /cache
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
          {{- if .Values.jellyfin.extraVolumeMounts }}
          {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.extraVolumeMounts "context" $) | nindent 12 }}
          {{- end }}
        {{- if .Values.jellyfin.sidecars }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.jellyfin.sidecars "context" $) | nindent 8 }}
        {{- end }}
      volumes:
        - name: empty-dir
          emptyDir: {}
        {{- if .Values.jellyfin.extraVolumes }}
        {{- include "common.tplvalues.render" (dict "value" .Values.jellyfin.extraVolumes "context" $) | nindent 8 }}
        {{- end }}
  {{- if .Values.jellyfin.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: jellyfin-config
        {{- if or .Values.persistence.config.annotations .Values.commonAnnotations }}
        {{- $claimAnnotations := include "common.tplvalues.merge" (dict "values" .Values.persistence.config.annotations .Values.commonAnnotations "context" .) | fromYaml }}
        annotations: {{- include "common.tplvalues.render" ( dict "value" $claimAnnotations "context" $ ) | nindent 10 }}
        {{- end }}
        {{- if .Values.commonLabels }}
        labels: {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
        {{- range .Values.persistence.config.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.config.size | quote }}
        {{- if .Values.persistence.config.selector }}
        selector: {{- include "common.tplvalues.render" (dict "value" .Values.persistence.config.selector "context" $) | nindent 10 }}
        {{- end }}
        {{- include "common.storage.class" (dict "persistence" .Values.persistence.config "global" .Values.global) | nindent 8 }}
    - metadata:
        name: jellyfin-cache
        {{- if or .Values.persistence.cache.annotations .Values.commonAnnotations }}
        {{- $claimAnnotations := include "common.tplvalues.merge" (dict "values" .Values.persistence.cache.annotations .Values.commonAnnotations "context" .) | fromYaml }}
        annotations: {{- include "common.tplvalues.render" ( dict "value" $claimAnnotations "context" $ ) | nindent 10 }}
        {{- end }}
        {{- if .Values.commonLabels }}
        labels: {{- include "common.labels.matchLabels" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
        {{- range .Values.persistence.cache.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.cache.size | quote }}
        {{- if .Values.persistence.cache.selector }}
        selector: {{- include "common.tplvalues.render" (dict "value" .Values.persistence.cache.selector "context" $) | nindent 10 }}
        {{- end }}
        {{- include "common.storage.class" (dict "persistence" .Values.persistence.cache "global" .Values.global) | nindent 8 }}
  {{- end }}
