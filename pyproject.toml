[tool.poetry]
name = "mkchart"
version = "0.1.0"
description = "Create a helm chart from a template"
authors = ["Tom Helander <thomas.helander@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.15.2"
rich = "^14.0.0"
jinja2 = "^3.1.6"
pydantic = "^2.11.3"


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
ruff = "^0.11.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
